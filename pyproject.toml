[project]
name = "memrecon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Goncalves", email = "samantha.v.goncalves@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
memrecon = "memrecon:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
